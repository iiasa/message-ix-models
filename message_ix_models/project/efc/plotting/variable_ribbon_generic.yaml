# EFC ribbon-plot configuration for vet_ribbon_generic.R
#
# Targets the clean generic_flow Excel layout (see efc/generic_report.py):
#   dim_head | dim_t | dim_m | dim_c | dim_l
# e.g. in|meth_h2|feedstock_dac|dac_co2|final
#
# Sector hierarchy (Industry|Chemicals|...) is NOT in the variable name.
# Tag sectors with group-level dim_s on every in| sector group that feeds an
# aggregate_by: dim_s cross-sector figure (first-match-wins). out| production
# groups do not need dim_s. Optional group-level dim_head (in|out) lets
# variables be listed as t|m|c|l; the script prepends the head.
#
# A segment of "*" is a wildcard over that dimension (expanded against the
# data). Use it for multi-mode techs (bunkers, meth_h2 CO2 modes, ...).
#
# Only in|/out| flows. 
#
# Values are model-native (energy GWa, material Mt). vet_ribbon_generic.R
# fills Unit from dim_l. Energy groups below rescale GWa -> EJ (x0.03154)
# at plot time; material / Mt H2 groups keep their own scale_factor.

x_axis_range: [2020, 2100]
main_region: R12_GLB

near_term_fill:
  from_scenario: baseline
  to_scenario: 1p5c
  years: [2020, 2025]

