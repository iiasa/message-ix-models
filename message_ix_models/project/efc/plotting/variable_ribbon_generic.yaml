  - out|meth_ng_ccs|*|methanol|primary
  - out|meth_coal|*|methanol|primary
  - out|meth_coal_ccs|*|methanol|primary
  - out|meth_bio|*|methanol|primary
  - out|meth_bio_ccs|*|methanol|primary
  - out|meth_h2|*|methanol|primary
  - out|meth_ng|*|methanol|primary_material
  - out|meth_ng_ccs|*|methanol|primary_material
  - out|meth_coal|*|methanol|primary_material
  - out|meth_coal_ccs|*|methanol|primary_material
  - out|meth_bio|*|methanol|primary_material
  - out|meth_bio_ccs|*|methanol|primary_material
  - out|meth_h2|*|methanol|primary_material

