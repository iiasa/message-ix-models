# Production (out|) by technology — aggregate_by dim_t
# =========================================================================

# Merchant H2 outs (GWa -> Mt H2 at LHV 120). Captive H2, if listed, is already
# Mt H2 and is skipped by scale_from_unit.
- title: "out|hydrogen production|by technology (Mt)"
  aggregate_by: dim_t
  plot_unit: "Mt H2"
  scale_factor: 0.0002628333333333333
  scale_from_unit: "GWa"
  variables:
  - out|h2_smr|*|hydrogen|*
  - out|h2_smr_ccs|*|hydrogen|*
  - out|h2_coal|*|hydrogen|*
  - out|h2_coal_ccs|*|hydrogen|*
  - out|h2_bio|*|hydrogen|*
  - out|h2_bio_ccs|*|hydrogen|*
  - out|h2_elec_alk|*|hydrogen|*
  - out|h2_elec_pem|*|hydrogen|*
  - out|h2_elec_soe|*|hydrogen|*
  - out|h2_pyro_elec|*|hydrogen|*
  - out|catalytic_reforming_ref|*|hydrogen|*

# Fuel (primary, GWa) + feedstock (primary_material, Mt) in one stack.
# scale_from_unit limits the meth_t_d bridge to GWa rows; Mt rows pass through.
- title: "out|methanol production|by technology (Mt)"
  aggregate_by: dim_t
  plot_unit: "Mt methanol"
  scale_factor: 1.43345  # 1 / 0.697615 GWa/Mt
  scale_from_unit: "GWa"
  variables:
