groups:

# =========================================================================
# Production (out|) by technology
# =========================================================================

# 3-segment names (out|tech|commodity): dim_t = technology.
# Includes catalytic_reforming_ref: refinery byproduct hydrogen.
- title: "out|hydrogen production|by technology (EJ)"
  aggregate_by: dim_t
  variables:
  - out|h2_smr|hydrogen
  - out|h2_smr_ccs|hydrogen
  - out|h2_coal|hydrogen
  - out|h2_coal_ccs|hydrogen
  - out|h2_bio|hydrogen
  - out|h2_bio_ccs|hydrogen
  - out|h2_elec_alk|hydrogen
  - out|h2_elec_pem|hydrogen
  - out|h2_elec_soe|hydrogen
  - out|h2_pyro_elec|hydrogen
  - out|catalytic_reforming_ref|hydrogen

- title: "out|methanol production|by technology (EJ)"
  aggregate_by: dim_t
  variables:
  - out|meth_ng|methanol
  - out|meth_ng_ccs|methanol
  - out|meth_coal|methanol
  - out|meth_coal_ccs|methanol
  - out|meth_bio|methanol
  - out|meth_bio_ccs|methanol
  - out|meth_h2|methanol

# Ammonia is mass-basis (Mt). h2_NH3 (merchant-H2 ammonia) and residual_NH3
# are additions relative to the 20260615 inventory.
- title: "out|ammonia production|by technology (Mt)"
  aggregate_by: dim_t
  variables:
  - out|gas_NH3|NH3
  - out|gas_NH3_ccs|NH3
  - out|coal_NH3|NH3
  - out|coal_NH3_ccs|NH3
  - out|biomass_NH3|NH3
  - out|biomass_NH3_ccs|NH3
  - out|fueloil_NH3|NH3
  - out|fueloil_NH3_ccs|NH3
  - out|electr_NH3|NH3
  - out|residual_NH3|NH3

- title: "out|ethanol production|by technology (EJ)"
  aggregate_by: dim_t
  variables:
  - out|eth_bio|ethanol
  - out|eth_bio_ccs|ethanol
  - out|liq_bio|ethanol
  - out|liq_bio_ccs|ethanol

# 3-segment names: dim_m = product. Leaf routes only; the
# out|Chemicals|production_HVC|HVC aggregate is excluded (double count).
- title: "out|olefins & BTX|by product (Mt)"
  aggregate_by: dim_m
  variables:
  - out|steam_cracker_petro|ethylene
  - out|steam_cracker_petro|propylene
  - out|steam_cracker_petro|BTX
  - out|MTO_petro|ethylene
  - out|MTO_petro|propylene
  - out|ethanol_to_ethylene_petro|ethylene

# Distribution-stage outputs. The GWa->Mt bridge for chemicals sits at the
# t_d technologies, so there is no per-route Mt methanol series upstream.
- title: "out|distribution|energy stage (EJ)"
  variables:
  - out|Chemicals|meth_t_d|methanol fuel
  - out|Chemicals|eth_t_d|ethanol

- title: "out|distribution|material stage (Mt)"
  variables:
  - out|Chemicals|meth_t_d|methanol feedstock material
  - out|meth_ind_fs|methanol

# Single series: electricity from hydrogen turbines.
- title: "out|power|h2 turbine electricity (EJ)"
  variables:
  - out|Power|h2_ct|electricity

# =========================================================================
# Consumption (in|) by sector. These groups also assign each variable its
# dim_s sector tag, consumed by the cross-sector figures further down.
# =========================================================================

# 4-segment names (in|Shipping|tech|commodity): dim_c = commodity.
# All bunkers report in energy terms (EJ), including NH3_bunker (bridged
# Mt->GWa upstream by NH3_tobunker). loil_bunker and coal bunkers are
# deliberately not reported (hollow addon-parent / phantom technologies).
- title: "in|shipping bunkers|by commodity (EJ)"
  dim_s: shipping
  aggregate_by: dim_c
  variables:
  - in|Shipping|foil_bunker|fueloil
  - in|Shipping|foil_occ_bunker|fueloil
  - in|Shipping|LNG_bunker|LNG
  - in|Shipping|LNG_occ_bunker|LNG
  - in|Shipping|meth_bunker|methanol
  - in|Shipping|eth_bunker|ethanol
  - in|Shipping|NH3_bunker|ammonia
  - in|Shipping|LH2_bunker|hydrogen

# 5-segment names (in|Transportation|<mode>|tech|commodity): dim_l = commodity.
