# =========================================================================
# Capacity by technology. CAP is total installed capacity (GW for hydrogen
# and methanol producers -- energy output basis; Mt/yr for the ammonia
# chain -- mass output basis; see docs/reporting_c3_capacity_cost.md).
# =========================================================================

- title: "CAP|hydrogen production (GW)"
  aggregate_by: dim_t
  variables:
  - CAP|h2_smr
  - CAP|h2_smr_ccs
  - CAP|h2_coal
  - CAP|h2_coal_ccs
  - CAP|h2_bio
  - CAP|h2_bio_ccs
  - CAP|h2_elec_alk
  - CAP|h2_elec_pem
  - CAP|h2_elec_soe
  - CAP|h2_pyro_elec

- title: "CAP|methanol production (GW)"
  aggregate_by: dim_t
  variables:
  - CAP|meth_ng
  - CAP|meth_ng_ccs
  - CAP|meth_coal
  - CAP|meth_coal_ccs
  - CAP|meth_bio
  - CAP|meth_bio_ccs
  - CAP|meth_h2

# NOTE: CAP|h2_NH3 is not emitted (CAP_NEW|h2_NH3 exists but the CAP family
# lacks it) -- known gap in ammonia_cap, flagged in coverage_v8.
- title: "CAP|ammonia production (Mt/yr)"
  aggregate_by: dim_t
  variables:
  - CAP|gas_NH3
  - CAP|gas_NH3_ccs
  - CAP|coal_NH3
  - CAP|coal_NH3_ccs
  - CAP|biomass_NH3
  - CAP|biomass_NH3_ccs
  - CAP|fueloil_NH3
  - CAP|fueloil_NH3_ccs
  - CAP|electr_NH3

# CAP_NEW|* (new capacity additions) and Investment|* (million USD) families
# exist for the same technology sets and can be added as groups on demand;
# left out here to keep the deck size manageable.

# =========================================================================
# Deliberately excluded variables (do NOT add to stacks):
# - in|Shipping|all, in|Transportation|{Aviation,Bus,Light-Duty Vehicle,
#   Truck}|all, in|all|{NH3,hydrogen,methanol}, out|all|{NH3,methanol},
#   in|hydrogen|total electricity: engine-side aggregates of leaves already
#   stacked above.
# - out|Chemicals|production_HVC|HVC: aggregate of the olefin leaf routes.
# - in|MTO_petro|methanol (3-segment): duplicate name of
#   in|Industry|Chemicals|MTO_petro|methanol.
# - All Final Energy / Secondary Energy / Production parent aggregates whose
#   child leaves appear in a group (e.g. Secondary Energy|Hydrogen,
#   Final Energy|Bunkers|Shipping, Production|Chemicals|Ammonia|Gases).
# - Final Energy|Bunkers|Shipping|Liquids|Oil|foil: child of Liquids|Oil,
#   already stacked.
# - material/fe leaf detail (73 variables) and fs1/fs2 leaves: represented
#   here by their carrier/family aggregates; add dedicated groups if a
#   subsector deep-dive is needed.
# - Ice_L_ptrp (historical-only LDV tech): zero in 2020+, not reported.
# - loil_bunker, coal bunkers (coal_adv_cfNH3 etc.): hollow addon-parent /
#   phantom technologies, deliberately unreported (#348, #350).
# =========================================================================
