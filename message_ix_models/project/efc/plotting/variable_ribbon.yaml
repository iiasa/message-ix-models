  # ---------------------------------------------------------------------
  # Per-variable-stacked groups (no aggregate_by) key the fill scale on the
  # FULL variable name: make_fill_colors() in vet_ribbon.R matches the layer
  # level against these keys with intersect(), i.e. exact whole-string
  # equality -- it never looks at a trailing segment. Without a full-name key
  # a layer silently falls through to the automatic base_palette, which is
  # how these pages drew arbitrary colors. Rules used below:
  #   - a layer whose concept already has a color above reuses that hex
  #     unchanged (same concept, same color, on every page);
  #   - where one page stacks several layers of the SAME concept, the repeats
  #     are systematic tints (toward white) or shades (toward black) of that
  #     concept's hex, never a new hue;
