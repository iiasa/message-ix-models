# EFC ribbon-plot configuration for vet_ribbon.R
#
# Drop-in replacement for tool/plot/vet/variable_ribbon.yaml, carrying the
# finalized EFC variable names as they appear in the EFC Excel exports
# (verified against baseline_v7_2026-08-04_raw.xlsx, 4064 variables).
# To use: copy this file to tool/plot/vet/variable_ribbon.yaml (the path is
# hardcoded in vet_ribbon.R); the original dated file in data/20260615plotting/
# stays unchanged as the source reference.
#
# How the dim_* columns behave with EFC names
# --------------------------------------------
# vet_ribbon.R splits each variable on "|" into at most five parts:
#   dim_head | dim_t | dim_m | dim_c | dim_l
# EFC names are sector-aware and have VARIABLE segment counts, so the dim_*
# columns no longer mean head/tech/mode/commodity/level. A group may only use
# aggregate_by: dim_* when every variable in it has the same segment count;
# each such group notes which dimension holds what. Groups mixing shapes stack
# per-variable instead.
#
# Two rules carried over from the reporting side:
# - A group may contain an aggregate OR its child leaves, never both
#   (stacking both double-counts). Excluded aggregates are listed at the end.
# - One unit basis per group: energy (EJ/yr) and material (Mt/yr) variables
#   never share a stack, mirroring the *_GWa / *_Mt page split.

# The one warning a clean run still prints
# --------------------------------------------
# A full run ends with several hundred repetitions of
#   Removed N rows containing non-finite outside the scale range (stat_align())
# This is expected and is NOT the x-axis clip below: prepare_group() filters
# Year to x_axis_range before ggplot sees the data, so 2005 and 2110 are
# already gone and cannot be what is removed. The removed rows are empty cells
# in the EFC export. Its year columns start at 1990, but the reported variables
# only carry values from the first model year, so 2010 and 2015 are blank for
# essentially every variable (measured on baseline_v8: 21695 of 52583 rows NA
# at 2010 and again at 2015, against 363 at 2030). Two blank in-range year
# columns times one series per variable is why N is almost always 2x the
# group's variable count; the exceptions are pages carrying a technology that
# starts later still, which adds its own blank 2020/2025 (e.g. the shipping
# bunkers page reports N = 14 for 6 variables).
# Nothing is silently dropped from the figures: ggplot removes exactly the
# cells that have no value, and the series begin where the data begins. Treat
# any OTHER warning text as a real finding.

# X-axis range: [min, max], or null for the full data range. 2110 is an
# end-of-horizon artifact and is deliberately cut off.
x_axis_range: [2010, 2100]

# Main (large left) plot region; the R12_ prefix is normalized away.
main_region: R12_GLB

# Near-term backfill: copy 2020/2025 values, per variable and region, from the
# baseline into scenarios that do not report them (substring match on the
# Scenario column). Comment out to disable.
near_term_fill:
  from_scenario: baseline
  to_scenario: 1p5c
  years: [2020, 2025]

# Fixed colors, keyed by stacked-layer label.
# - Commodity layers keep the colors from the 20260615 file so the figures
#   stay visually comparable with earlier decks; new commodities extend that
#   palette. "electricity" and "electr" both occur in EFC names (hydrogen
#   reporting uses the long form) and are pinned to the same hex.
# - Technology layers (production groups) follow the cross-commodity process
#   canon: grey = unabated gas, blue = gas+CCS, black = coal, slate = coal+CCS,
#   brown = biomass, green = electrolytic, pink = hydrogen-fed.
# - dim_s sector layers are pinned so a sector keeps its color across every
#   cross-sector figure regardless of which sectors appear in it.
