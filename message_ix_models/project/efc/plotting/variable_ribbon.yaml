  #     (grey = unabated gas, blue = gas+CCS, black = coal, slate = coal+CCS,
  #     brown = biomass, dark green = biomass+CCS, green = electrolytic,
  #     pink = white/merchant-H2-fed, red = fuel oil, salmon = fuel oil+CCS).
