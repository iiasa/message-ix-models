# SPARCCLE water adaptation scenarios. Every scenario lives on the starter's
# local HSQLDB platform (sparccle_<model>_<scenario>, made by
# scripts/localize_starter.py from `source_platform`).
#
#   mix-models sparccle_water run --config <this file> "SSP2 base" --go     # steps: "<SSP> <key>"
#   mix-models sparccle_water names SSP2 BAUfgd     # -> platform model scenario
#
# Solving: `base` and `adapt` are solved by the `water-ix nexus` build itself;
# `BAUfgd` and `maladapt` by ../scripts/solve_local.py (see
# scripts/run_sparccle_water.sh).

source_platform: ixmp_dev
local_db: ~/sparccle/db     # <local_db>/<model>/<scenario>/db
regions: R12
name: "CurrentPolicies_{ssp}_W_{key}"   # scenario name; {key} = the scenario's label or key

# Water-module inputs of every nexus build: hydrology of RCP 7.0 (NPiREF), low
# reliability tier.
nexus:
  rcps: 7p0
  rels: low

starters:
  SSP2:
    model: SSP_SSP2_v6.6_sp
    scenario: NPiREF_GDP_CI_50_ensemble_2
    renewable_growth: 0.02   # growth_activity_up on extract_surfacewater / extract_groundwater
  SSP3:
    model: SSP_SSP3_v6.6_sp
    scenario: NPiREF_GDP_CI_50_ensemble_2
    renewable_growth: 0.03

# Levers. `build: nexus` scenarios are produced by `water-ix nexus` on the
# starter (`sdgs` is passed through); `from:` scenarios are clones of another
# scenario with constraints added. `eflow`, `renewable_growth` and `ban_mode`
# can also follow a `build: nexus` scenario (applied in place after the build).
#
#   eflow            bound_activity_lo on return_flow = environmental flow (VMF,
#                    capped at 70 % of availability), the same rows an SDG build
#                    writes, here without the rest of the SDG package
#   renewable_growth growth_activity_up of the renewable extractors set to the
#                    starter's rate (#522 writes 0.02 in every build)
#   ban_mode         bound_activity_up = 0 on every technology output in that
#                    mode from the first model year (Mf = efficient distribution:
#                    urban_t_d, rural_t_d, sewerage, recycle, discharge)
#   fossil_gw_var_cost
#                    var_cost on extract_gw_fossil, USD/MCM in the model's cost
#                    unit (= USD/m3). The base prices fossil groundwater at
#                    ~0.03 USD/m3 (inv 0.065 over 20 y + electricity) against
#                    ~0.34 for membrane desalination (inv 1.90 over 30 y, fix
#                    0.155, electricity 3 kWh/m3; no heat since the 11-02 CSV
#                    fix), so 0.4 puts it after desalination.
#   desal_free       copy the last historical desalination builds (2025) to the
#                    period before the first model year (2030) and remove the
#                    module's 10 %/yr growth_new_capacity_up on membrane and
#                    distillation; without it the growth chain starts from zero
#                    and no desalination plant can ever be built
#   fossil_gw_cap    bound_activity_up on extract_gw_fossil in every model year
#                    = factor x its historical_activity of the last historical
#                    year (the #522 merit-order seed); the 36 basins without
#                    history (no surface/groundwater capacity data, fossil-only
#                    in the base) stay unbounded
#   desal_potential  replace bound_total_capacity_up on extract_salinewater_basin
#                    with another SSP series of the projection file
#                    (SSP1/SSP3/SSP5 are modelled; SSP2 inherits SSP1)
#   sdgs: SDG        the water module's SDG package: Mf-only distribution with
#                    mid-tier costs, treatment targets (urban 0.95, rural 0.8),
#                    connection targets, SDG6 recycling, e-flow bounds
scenarios:
  base:
    build: nexus
    sdgs: baseline
  # Mf (efficient distribution: 10 % instead of 20 % losses, half the electricity,
  # higher variable cost) is banned everywhere except +adapt (10-22). BAUfgd is
  # the BAU of record; the 10-21 BAU and BAUfg runs were stepping stones.
  # 11-02: every constrained scenario holds fossil groundwater at its 2030
  # dispatch level (fossil_gw_cap 1.0: bound_activity_up = historical_activity
  # of the #522 merit-order seed; basins without history stay unbounded); the
  # var_cost stays as the price of what is still pumped.
  BAUfgd:
    from: base
    eflow: true
    renewable_growth: true
    fossil_gw_var_cost: 0.4
    desal_free: true
    ban_mode: Mf
    fossil_gw_cap: 1.0
  # Final set (10-22): both carry the desalination fix and the fossil-groundwater
  # price, so desalination is used before fossil groundwater as the narrative asks.
  # maladapt: fossil groundwater priced above membrane desalination (~0.54 USD/m3
  # with the heat input the CSV carried until 11-02; ~0.34 without) so
  # desalination comes first, as the narrative asks; BAUfgd keeps 0.4 (10-23).
  maladapt:
    from: base
    eflow: true
    renewable_growth: true
    fossil_gw_var_cost: 0.7
    desal_free: true
    ban_mode: Mf            # no efficiency improvement in distribution
    fossil_gw_cap: 1.0
  adapt:
    label: "+adapt"   # step names cannot hold "+" (regex targets); the scenario name can
    build: nexus
    sdgs: SDG         # efficient distribution only, treatment/recycling targets, e-flows
    renewable_growth: true
    fossil_gw_var_cost: 0.4
    fossil_gw_cap: 1.0
    # no desal_free (10-22): desalination stays as the module builds it

# Not represented yet (see README): irrigation efficiency, desalination
# prioritised over fossil groundwater (today the LP orders them by cost), a
# calibrated 10 % loss reduction.
