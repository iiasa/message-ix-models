# SPARCCLE Scenario Configuration
#
# Consumed by `message_ix_models.project.sparccle.workflow.generate`.
#
# Phase 1 — Module build ("{ssp}/{scenario} cooling"):
#   subprocess `mix-models water-ix cooling` → {scenario}_cooling
#
# Phase 2 — CID variants ("{ssp}/{scenario} CI_b" / "CI_p" / "CI_bp"):
#   buildings: rc_spec/rc_therm demand adjustment        → _CI_b
#   cooling:   freshwater + dry cooling capacity factors → _CI_p
#   combined:  buildings + cooling on the cooling clone  → _CI_bp

platform_info:
  name: ixmp_dev

regions: R12

# Starter scenarios — assumed to exist on `platform_info.name`. The list
# is the source of truth for which scenarios the build pipeline iterates
# over.
#
# `_PHY` starters are prep clones of the solved GDP CI_50 scenarios.
# magicc_output_dir points at the solved scenario's name, without the
# `_PHY` suffix, because the MAGICC GSAT ensemble is keyed to that
# solved scenario.
#
# v6.6 layout note: MAGICC outputs sit under a per-model subtree
# (`<MODEL>/<scenario>/`). v6.5 used a flat `<MODEL>__<scenario>/`
# directory. Each starter row carries its own directory path, so no
# implicit naming rule lives in the library code.
starters:
  - model: SSP_SSP1_v6.6_sp
    scenario: NPiREF_GDP_CI_50_ensemble_1_PHY
    ssp: SSP1
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP1_v6.6_sp/NPiREF_GDP_CI_50_ensemble_1/
  - model: SSP_SSP2_v6.6_sp
    scenario: NPiREF_GDP_CI_50_ensemble_2_PHY
    ssp: SSP2
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP2_v6.6_sp/NPiREF_GDP_CI_50_ensemble_2/
  - model: SSP_SSP3_v6.6_sp
    scenario: NPiREF_GDP_CI_50_ensemble_2_PHY
    ssp: SSP3
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP3_v6.6_sp/NPiREF_GDP_CI_50_ensemble_2/
  - model: SSP_SSP1_v6.6_sp
    scenario: INDC2030i_439f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP1
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP1_v6.6_sp/INDC2030i_439f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP2_v6.6_sp
    scenario: INDC2030i_439f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP2
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP2_v6.6_sp/INDC2030i_439f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP1_v6.6_sp
    scenario: INDC2030i_800f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP1
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP1_v6.6_sp/INDC2030i_800f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP2_v6.6_sp
    scenario: INDC2030i_800f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP2
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP2_v6.6_sp/INDC2030i_800f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP3_v6.6_sp
    scenario: INDC2030i_800f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP3
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP3_v6.6_sp/INDC2030i_800f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP3_v6.6_sp
    scenario: INDC2030i_520f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP3
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP3_v6.6_sp/INDC2030i_520f_GDP_CI_50_ensemble_1/
  - model: SSP_SSP3_v6.6_sp
    scenario: INDC2030i_600f_GDP_CI_50_ensemble_1_PHY
    ssp: SSP3
    magicc_output_dir: /pdrive/projects/watxene/IMPACTS/sparrcle/magicc_output/SSP_SSP3_v6.6_sp/INDC2030i_600f_GDP_CI_50_ensemble_1/

# Phase-1 cooling-module build settings (passed to `mix-models water-ix cooling`)
cooling:
  rcps: 2p6
  rels: low

# Phase-2 CID settings
cid:
  # `n_runs: null` means use all available MAGICC ensemble members.
  n_runs: null
  # Earliest model year touched by cooling CID constraints and dry-cooling derating.
  min_year: 2045
