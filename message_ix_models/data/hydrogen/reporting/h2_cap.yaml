# CAP|<tech> — cumulative net installed capacity of the hydrogen production
# technologies. NOT in mapping_clean (only CAP_NEW + Investment appear); built
# alongside CAP_NEW per user decision 2026-07-01, final keep-or-drop pending
# confirmation with Yiyi. genno CAP:nl-t-ya sums over vintages; natively GW.

var:
  CAP

iamc_prefix:
  "CAP|"

unit: GW

vars:
  h2_smr:
    filter: {technology: h2_smr}
    original_unit: GW
    short: cap_h2_smr

  h2_smr_ccs:
    filter: {technology: h2_smr_ccs}
    original_unit: GW
    short: cap_h2_smr_ccs

  h2_coal:
    filter: {technology: h2_coal}
    original_unit: GW
    short: cap_h2_coal

  h2_coal_ccs:
    filter: {technology: h2_coal_ccs}
    original_unit: GW
    short: cap_h2_coal_ccs

  h2_bio:
    filter: {technology: h2_bio}
    original_unit: GW
    short: cap_h2_bio

  h2_bio_ccs:
    filter: {technology: h2_bio_ccs}
    original_unit: GW
    short: cap_h2_bio_ccs

  h2_elec_alk:
    filter: {technology: h2_elec_alk}
    original_unit: GW
    short: cap_h2_elec_alk

  h2_elec_pem:
    filter: {technology: h2_elec_pem}
    original_unit: GW
    short: cap_h2_elec_pem

  h2_elec_soe:
    filter: {technology: h2_elec_soe}
    original_unit: GW
    short: cap_h2_elec_soe

  h2_pyro_elec:
    filter: {technology: h2_pyro_elec}
    original_unit: GW
    short: cap_h2_pyro_elec
