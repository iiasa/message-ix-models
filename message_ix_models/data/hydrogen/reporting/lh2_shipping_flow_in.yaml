# EFC Shipping LH2 bunker INPUT flow under the spec name (open-questions item 15):
#   in|Shipping|LH2_bunker|hydrogen  (EJ/yr).
#
# Sole reporting home for this flow since 2026-07-28: the legacy Use|-prefixed
# twin (lh2_use.yaml, leaf Use|LH2|Transportation|Shipping) was retired with the
# rest of that file, whose other three leaves filtered coordinates absent from
# the MT model. LH2_bunker serves the 9 future ship-type modes only, commodity
# lh2 at level final, GWa in (the 1.3 input coefficient is an in-energy
# liquefaction/boil-off loss).
# The Final Energy|Bunkers|Shipping|Hydrogen global aggregate points at this
# leaf (data/reporting/aggregates_global.yaml).

var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  Shipping|LH2_bunker|hydrogen:
    filter:
      { technology: LH2_bunker, mode: [shp_bulk_short_future, shp_bulk_long_future, shp_container_short_future, shp_container_long_future, shp_general_short_future, shp_general_long_future, shp_roro_short_future, shp_roro_long_future, shp_chemical], commodity: lh2, level: final}
    original_unit: GWa
    short: in_LH2_bunker_hydrogen
