# EFC industry INPUT energy flows: in|Industry|<Subsector>|<tech>|<commodity>.
# Covers hydrogen demand plus the corrected refining, steel, and process-heat
# ribbon inputs. Every leaf is native GWa converted to EJ/yr.
#
# Per-tech LEVEL and MODE are taken from the scenario `input` parameter (queried on
# the ixmp-dev baseline), NOT assumed. Both vary and both are load-bearing:
#   - level: mostly `final`; *_refining draw hydrogen at `secondary`;
#     hydro_cracking_ref at `refinery`.
#   - mode: furnaces high_temp(+low_temp), fuel cells low_temp, h2_fc_I/h2_i/
#     dri_h2_steel M1, hydro_cracking_ref cracking_gasoline/cracking_loil.
# These industry techs have NO mode literally named "all" (unlike the transport
# demand techs), so a `mode: all` filter would match nothing and emit an empty frame.
#
# NOT here: ethanol_to_ethylene_petro -- already reported correctly under
# in|Industry|Chemicals| in data/chemicals/ethanol_flow_in_energy.yaml. The spec's
# "ethanol_to_ethanol_petro" is a typo/duplicate of it (no such model tech); flag to
# Yiyi, do not author (would double-count).
#
# All 15 filter techs verified present in the baseline scenario technology set.
# Source: results/reporting/coverage_20260625.csv (absent demand_s industry leaves)
# + scenario input-parameter coordinates.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  # ---- Industry|Other: furnaces (hydrogen @ final; high/low temperature modes) ----
  Industry|Other|furnace_h2_steel|hydrogen:
    filter: {technology: furnace_h2_steel, commodity: hydrogen, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_h2_steel_hydrogen

  Industry|Other|furnace_h2_cement|hydrogen:
    filter: {technology: furnace_h2_cement, commodity: hydrogen, level: final, mode: [high_temp]}
    original_unit: GWa
    short: in_furnace_h2_cement_hydrogen

  Industry|Other|furnace_h2_aluminum|hydrogen:
    filter: {technology: furnace_h2_aluminum, commodity: hydrogen, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_h2_aluminum_hydrogen

  Industry|Other|furnace_h2_petro|hydrogen:
    filter: {technology: furnace_h2_petro, commodity: hydrogen, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_h2_petro_hydrogen

  Industry|Other|furnace_h2_resins|hydrogen:
    filter: {technology: furnace_h2_resins, commodity: hydrogen, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_h2_resins_hydrogen

  # furnace_h2_refining draws hydrogen at `secondary`, not `final`
  Industry|Other|furnace_h2_refining|hydrogen:
    filter: {technology: furnace_h2_refining, commodity: hydrogen, level: secondary, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_h2_refining_hydrogen

  # ---- Industry|Other: fuel cells (hydrogen, low_temp; refining @ secondary) ----
  Industry|Other|fc_h2_steel|hydrogen:
    filter: {technology: fc_h2_steel, commodity: hydrogen, level: final, mode: [low_temp]}
    original_unit: GWa
    short: in_fc_h2_steel_hydrogen

  Industry|Other|fc_h2_aluminum|hydrogen:
    filter: {technology: fc_h2_aluminum, commodity: hydrogen, level: final, mode: [low_temp]}
    original_unit: GWa
    short: in_fc_h2_aluminum_hydrogen

  Industry|Other|fc_h2_petro|hydrogen:
    filter: {technology: fc_h2_petro, commodity: hydrogen, level: final, mode: [low_temp]}
    original_unit: GWa
    short: in_fc_h2_petro_hydrogen

  Industry|Other|fc_h2_resins|hydrogen:
    filter: {technology: fc_h2_resins, commodity: hydrogen, level: final, mode: [low_temp]}
    original_unit: GWa
    short: in_fc_h2_resins_hydrogen

  Industry|Other|fc_h2_refining|hydrogen:
    filter: {technology: fc_h2_refining, commodity: hydrogen, level: secondary, mode: [low_temp]}
    original_unit: GWa
    short: in_fc_h2_refining_hydrogen

  # ---- Industry|Other: generic industry hydrogen (mode M1, level final) ----
  Industry|Other|h2_fc_I|hydrogen:
    filter: {technology: h2_fc_I, commodity: hydrogen, level: final, mode: M1}
    original_unit: GWa
    short: in_h2_fc_I_hydrogen

  Industry|Other|h2_i|hydrogen:
    filter: {technology: h2_i, commodity: hydrogen, level: final, mode: M1}
    original_unit: GWa
    short: in_h2_i_hydrogen

  # ---- Industry|Refining: hydrocracking draws hydrogen at `refinery`, cracking modes ----
  Industry|Refining|hydro_cracking_ref|hydrogen:
    filter: {technology: hydro_cracking_ref, commodity: hydrogen, level: refinery, mode: [cracking_gasoline, cracking_loil]}
    original_unit: GWa
    short: in_hydro_cracking_ref_hydrogen

  # ---- Industry|Iron and Steel: hydrogen DRI (mode M1) ----
  Industry|Iron and Steel|dri_h2_steel|hydrogen:
    filter: {technology: dri_h2_steel, commodity: hydrogen, level: final, mode: M1}
    original_unit: GWa
    short: in_dri_h2_steel_hydrogen

  # ---- Industry|Chemicals: hydrogen liquefaction feedstock (spec's classification) ----
  # h2_liq (H2 -> LH2) draws hydrogen@secondary (GWa). It is H2 logistics infrastructure, but
  # the customer spec files it under Industry|Chemicals (demand_s|chemicals + demand_c|hydrogen);
  # emitted under that name.
  Industry|Chemicals|h2_liq|hydrogen:
    filter: {technology: h2_liq, commodity: hydrogen, level: secondary, mode: M1}
    original_unit: GWa
    short: in_h2_liq_hydrogen

  # ---- Industry|Refining: cracking feedstock and process-heat inputs ----
  Industry|Refining|catalytic_cracking_ref|atm_gasoil:
    filter: {technology: catalytic_cracking_ref, commodity: atm_gasoil, level: desulfurized, mode: atm_gasoil}
    original_unit: GWa
    short: in_catalytic_cracking_ref_atm_gasoil

  Industry|Refining|catalytic_cracking_ref|ht_heat:
    filter: {technology: catalytic_cracking_ref, commodity: ht_heat, level: secondary, mode: [atm_gasoil, vacuum_gasoil]}
    original_unit: GWa
    short: in_catalytic_cracking_ref_ht_heat

  Industry|Refining|catalytic_cracking_ref|vacuum_gasoil:
    filter: {technology: catalytic_cracking_ref, commodity: vacuum_gasoil, level: desulfurized, mode: vacuum_gasoil}
    original_unit: GWa
    short: in_catalytic_cracking_ref_vacuum_gasoil

  Industry|Refining|hydro_cracking_ref|ht_heat:
    filter: {technology: hydro_cracking_ref, commodity: ht_heat, level: secondary, mode: cracking_loil}
    original_unit: GWa
    short: in_hydro_cracking_ref_ht_heat

  Industry|Refining|hydro_cracking_ref|vacuum_gasoil:
    filter: {technology: hydro_cracking_ref, commodity: vacuum_gasoil, level: desulfurized, mode: cracking_loil}
    original_unit: GWa
    short: in_hydro_cracking_ref_vacuum_gasoil

  # ---- Industry|Iron and Steel: exact live ribbon inputs ----
  Industry|Iron and Steel|dri_coal_steel|coal:
    filter: {technology: dri_coal_steel, commodity: coal, level: final, mode: M1}
