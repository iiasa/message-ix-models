    original_unit: GWa
    short: in_igcc_ccs_coal

  Power|loil_cc|lightoil:
    filter: {technology: loil_cc, commodity: lightoil, level: secondary, mode: M1}
    original_unit: GWa
    short: in_loil_cc_lightoil

  Power|loil_ppl|lightoil:
