# EFC Power-sector input energy flows: in|<Sector>|<tech>|<commodity>.
# Includes the existing h2_ct hydrogen demand and the corrected primary-fuel
# ribbon inputs. Every leaf is native GWa converted to EJ/yr.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  Power|h2_ct|hydrogen:
    filter: {technology: h2_ct, mode: M1, commodity: hydrogen, level: secondary}
    original_unit: GWa
    short: in_power_h2_ct_hydrogen

  Power|bio_istig|biomass:
    filter: {technology: bio_istig, commodity: biomass, level: primary, mode: M1}
    original_unit: GWa
    short: in_bio_istig_biomass

  Power|bio_istig_ccs|biomass:
    filter: {technology: bio_istig_ccs, commodity: biomass, level: primary, mode: M1}
    original_unit: GWa
    short: in_bio_istig_ccs_biomass

  Power|bio_ppl|biomass:
    filter: {technology: bio_ppl, commodity: biomass, level: primary, mode: M1}
    original_unit: GWa
    short: in_bio_ppl_biomass

  Power|coal_adv_ccs|coal:
    filter: {technology: coal_adv_ccs, commodity: coal, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_adv_ccs_coal

  Power|coal_adv|coal:
    filter: {technology: coal_adv, commodity: coal, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_adv_coal

  Power|coal_ppl_u|coal:
    filter: {technology: coal_ppl_u, commodity: coal, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_ppl_u_coal

  Power|coal_ppl|coal:
