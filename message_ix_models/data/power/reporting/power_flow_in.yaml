    original_unit: GWa
    short: in_gas_cc_gas

  Power|gas_cc_ccs|gas:
    filter: {technology: gas_cc_ccs, commodity: gas, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_cc_ccs_gas

  Power|gas_ct|gas:
    filter: {technology: gas_ct, commodity: gas, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_ct_gas

  Power|gas_ppl|gas:
