# EFC Shipping (international marine bunker) INPUT energy flows:
#   in|Shipping|<tech>|<fuel>  (EJ/yr).
#
# Fossil marine bunker fuels consumed by the base bunker techs at level `final`
# across the 19 MariTEAM ship-type modes (GWa -> EJ/yr). These carriers have no
# commodity-domain reporting home (fueloil/LNG are not chemicals), so they live
# here in the transport domain, which is already wired into the workflow and
# auto-discovers every *.yaml. The chemical marine fuels are reported from
# data/chemicals/ (meth_bunker, eth_bunker, NH3_bunker, all keyed Shipping|...)
# and LH2 from data/hydrogen/reporting/lh2_shipping_flow_in.yaml (the spec name;
# its legacy Use| twin was retired 2026-07-28).
#
# Filters verified against the BMT baseline (v9, ixmp-dev), input parameter:
#   foil_bunker: fueloil@final, 19 shp_* modes, coeff 1.0.
#   LNG_bunker:  LNG@final,     19 shp_* modes, coeff 1.0.
# The onboard-carbon-capture (OCC) addons -- foil_occ_bunker / LNG_occ_bunker --
# burn the same fuel with a ~20% penalty and only deploy from 2090 under the IMO
# bound. Reported since 2026-07-07 (C4 decision, reversing the earlier omission):
# the per-fuel Final Energy|Bunkers|Shipping totals must include the OCC extra
# fuel (Yiyi's ribbon plots these flows; the legacy reporter misses them; final
# say rides with the shipping-module owners, board #348). Their filters mirror
# the parents' 19-mode lists, coord-verified against the baseline input
# parameter on 2026-07-07 (check_filter_coords: all coords present).
# See docs/shipping_bunker_findings.md.
#
# EXCLUDED: loil_bunker's fuel path is disabled. The hollow addon parent has no
# input/output; its nonzero ACT is degenerate/phantom, not a commodity flow.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  Shipping|foil_bunker|fueloil:
    filter:
      technology: foil_bunker
      commodity: fueloil
      level: final
      mode: [shp_bulk_long_current, shp_bulk_long_future, shp_bulk_short_current, shp_bulk_short_future,
             shp_chemical, shp_container_long_current, shp_container_long_future, shp_container_short_current,
             shp_container_short_future, shp_general_long_current, shp_general_long_future,
             shp_general_short_current, shp_general_short_future, shp_oil, shp_roro_long_current,
             shp_roro_long_future, shp_roro_short_current, shp_roro_short_future, shp_solid]
    original_unit: GWa
    short: in_foil_bunker_fueloil

  Shipping|LNG_bunker|LNG:
    filter:
      technology: LNG_bunker
      commodity: LNG
      level: final
      mode: [shp_bulk_long_current, shp_bulk_long_future, shp_bulk_short_current, shp_bulk_short_future,
             shp_chemical, shp_container_long_current, shp_container_long_future, shp_container_short_current,
             shp_container_short_future, shp_general_long_current, shp_general_long_future,
             shp_general_short_current, shp_general_short_future, shp_oil, shp_roro_long_current,
             shp_roro_long_future, shp_roro_short_current, shp_roro_short_future, shp_solid]
    original_unit: GWa
    short: in_LNG_bunker_LNG

  Shipping|foil_occ_bunker|fueloil:
    filter:
      technology: foil_occ_bunker
      commodity: fueloil
      level: final
      mode: [shp_bulk_long_current, shp_bulk_long_future, shp_bulk_short_current, shp_bulk_short_future,
             shp_chemical, shp_container_long_current, shp_container_long_future, shp_container_short_current,
             shp_container_short_future, shp_general_long_current, shp_general_long_future,
             shp_general_short_current, shp_general_short_future, shp_oil, shp_roro_long_current,
             shp_roro_long_future, shp_roro_short_current, shp_roro_short_future, shp_solid]
    original_unit: GWa
    short: in_foil_occ_bunker_fueloil

  Shipping|LNG_occ_bunker|LNG:
    filter:
      technology: LNG_occ_bunker
      commodity: LNG
      level: final
      mode: [shp_bulk_long_current, shp_bulk_long_future, shp_bulk_short_current, shp_bulk_short_future,
             shp_chemical, shp_container_long_current, shp_container_long_future, shp_container_short_current,
             shp_container_short_future, shp_general_long_current, shp_general_long_future,
             shp_general_short_current, shp_general_short_future, shp_oil, shp_roro_long_current,
             shp_roro_long_future, shp_roro_short_current, shp_roro_short_future, shp_solid]
    original_unit: GWa
    short: in_LNG_occ_bunker_LNG
