# Global (cross-file) aggregate variables, consumed by compute_global_aggregates
# in report/hydrogen/h2_reporting.py. This directory sits OUTSIDE the per-domain
# data/<domain>/reporting/ dirs on purpose: leaf auto-discovery must never pick
# this file up.
#
# Each entry: {name, patterns, unit}. Patterns are shell-style globs matched
# against the full variable names of the assembled report (leaves + per-file
# aggregates); matches are summed once (union), and the engine raises if the
# matched variables do not all carry `unit`. Static validation (dead patterns,
# unit homogeneity, aggregate-vs-component double-counts) lives in
# EFC_2026/scripts/verify/check_aggregates_config.py -- run it on every edit.
#
# Provenance decisions carried from docs/reporting_c4_aggregates_trade.md:
# - loil_bunker is EXCLUDED everywhere (hollow addon-parent, phantom activity):
#   both Liquids|Oil rows equal the foil-only sum by construction.
# - OCC addons (foil/LNG_occ_bunker) are INCLUDED in per-fuel totals (ribbon
#   plots them; legacy misses them; final say with the shipping-module owners).
# - Shipping|Ammonia is a spec ADDITION pending ratification (open-questions
#   item 16); it is also included in the Bunkers|Shipping total, so that total
#   covers every marine fuel actually reported.
# - Shipping|Hydrogen sums the spec-named LH2 leaf in|Shipping|LH2_bunker|hydrogen
#   (item-15 re-point done; data/hydrogen/reporting/lh2_shipping_flow_in.yaml).
#   The legacy Use|LH2|Transportation|Shipping leaf still exists but is NOT
#   referenced here -- listing it alongside the in|Shipping|* glob would
#   double-count LH2 in the Bunkers|Shipping total.

aggregates:
  # --- Methanol-from-hydrogen by CO2 source (mode-split leaves, item 17) ---
  - name: Final Energy|Industry|Chemicals|Methanol|Hydrogen|BIC_CO2
    patterns: ["in|Industry|Chemicals|meth_h2|BIC_CO2|hydrogen"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Hydrogen|DAC_CO2
    patterns: ["in|Industry|Chemicals|meth_h2|DAC_CO2|hydrogen"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Hydrogen|FIC_CO2
    patterns: ["in|Industry|Chemicals|meth_h2|FIC_CO2|hydrogen"]
    unit: EJ/yr

  # --- Ammonia production inputs by feedstock and CCS route ---
  - name: Final Energy|Industry|Chemicals|Ammonia|Gases|Gas|w/ CCS
    patterns: ["in|Industry|Chemicals|gas_NH3_ccs|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Gases|Gas|w/o CCS
    patterns: ["in|Industry|Chemicals|gas_NH3|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Gases|w/ CCS
    patterns: ["in|Industry|Chemicals|gas_NH3_ccs|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Gases|w/o CCS
    patterns: ["in|Industry|Chemicals|gas_NH3|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Liquids|Oil|w/ CCS
    patterns: ["in|Industry|Chemicals|fueloil_NH3_ccs|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Liquids|Oil|w/o CCS
    patterns: ["in|Industry|Chemicals|fueloil_NH3|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Liquids|w/ CCS
    patterns: ["in|Industry|Chemicals|fueloil_NH3_ccs|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Liquids|w/o CCS
    patterns: ["in|Industry|Chemicals|fueloil_NH3|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|Biomass|w/ CCS
    patterns: ["in|Industry|Chemicals|biomass_NH3_ccs|biomass"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|Biomass|w/o CCS
    patterns: ["in|Industry|Chemicals|biomass_NH3|biomass"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|Coal|w/ CCS
    patterns: ["in|Industry|Chemicals|coal_NH3_ccs|coal"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|Coal|w/o CCS
    patterns: ["in|Industry|Chemicals|coal_NH3|coal"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|w/ CCS
    patterns:
      - "in|Industry|Chemicals|biomass_NH3_ccs|biomass"
      - "in|Industry|Chemicals|coal_NH3_ccs|coal"
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Ammonia|Solids|w/o CCS
    patterns:
      - "in|Industry|Chemicals|biomass_NH3|biomass"
      - "in|Industry|Chemicals|coal_NH3|coal"
    unit: EJ/yr
  # The legacy-owned parent Final Energy|Industry|Chemicals|Ammonia retains its
  # established scope; this Genno child does not overwrite that parent.
  - name: Final Energy|Industry|Chemicals|Ammonia|Hydrogen
    patterns: ["in|Industry|Chemicals|h2_NH3|hydrogen"]
    unit: EJ/yr

  # --- Methanol production inputs by feedstock and CCS route ---
  - name: Final Energy|Industry|Chemicals|Methanol|Gases|Gas|w/ CCS
    patterns: ["in|Industry|Chemicals|meth_ng_ccs|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Gases|Gas|w/o CCS
    patterns: ["in|Industry|Chemicals|meth_ng|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Gases|w/ CCS
    patterns: ["in|Industry|Chemicals|meth_ng_ccs|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Gases|w/o CCS
    patterns: ["in|Industry|Chemicals|meth_ng|gas"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Solids|Biomass|w/ CCS
    patterns: ["in|Industry|Chemicals|meth_bio_ccs|biomass"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Solids|Biomass|w/o CCS
    patterns: ["in|Industry|Chemicals|meth_bio|biomass"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Solids|Coal|w/ CCS
    patterns: ["in|Industry|Chemicals|meth_coal_ccs|coal"]
    unit: EJ/yr
  - name: Final Energy|Industry|Chemicals|Methanol|Solids|Coal|w/o CCS
    patterns: ["in|Industry|Chemicals|meth_coal|coal"]
    unit: EJ/yr

  # --- Aviation (con_ar family; conE_ar ethanol confirmed in spec + model) ---
  - name: Final Energy|Transportation|Aviation|Liquids|Oil
    patterns: ["in|Transportation|Aviation|con_ar|lightoil"]
    unit: EJ/yr
  - name: Final Energy|Transportation|Aviation|Hydrogen
    patterns: ["in|Transportation|Aviation|conh_ar|hydrogen"]
    unit: EJ/yr
  - name: Final Energy|Transportation|Aviation|Methanol
    patterns: ["in|Transportation|Aviation|conm_ar|methanol"]
    unit: EJ/yr
  - name: Final Energy|Transportation|Aviation|Ethanol
    patterns: ["in|Transportation|Aviation|conE_ar|ethanol"]
    unit: EJ/yr
  - name: Final Energy|Transportation|Aviation
    patterns: ["in|Transportation|Aviation|*"]
    unit: EJ/yr
  - name: in|Transportation|Aviation|all
    patterns: ["in|Transportation|Aviation|*"]
    unit: EJ/yr

  # --- Shipping (Final Energy|Bunkers|Shipping family) ---
  - name: Final Energy|Bunkers|Shipping|Methanol
    patterns: ["in|Shipping|meth_bunker|methanol"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Ethanol
    patterns: ["in|Shipping|eth_bunker|ethanol"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Hydrogen
    patterns: ["in|Shipping|LH2_bunker|hydrogen"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Gases|Gas
    patterns: ["in|Shipping|LNG_bunker|LNG", "in|Shipping|LNG_occ_bunker|LNG"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Liquids|Oil|foil
    patterns: ["in|Shipping|foil_bunker|fueloil", "in|Shipping|foil_occ_bunker|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Liquids|Oil
    patterns: ["in|Shipping|foil_bunker|fueloil", "in|Shipping|foil_occ_bunker|fueloil"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping|Ammonia
    patterns: ["in|Shipping|NH3_bunker|ammonia"]
    unit: EJ/yr
  - name: Final Energy|Bunkers|Shipping
    patterns: ["in|Shipping|*"]
    unit: EJ/yr

  # --- Trade (Trade|Goods|* and Trade|Secondary Energy|*) ---
  # NET exports per region are computed by compute_net_trade (data/reporting/
  # net_trade.yaml), NOT here: net = exp - imp - pro-rata bunker needs signed
  # components, which the sum-only compute_global_aggregates cannot express. The
  # provisional GROSS specs that lived here (Trade|Goods|Methanol,
  # Trade|Goods|Ammonia, Trade|Secondary Energy|Hydrogen) were removed in the
  # same change that landed net_trade.yaml -- both alive would duplicate the
  # variable names and make the pyam concat raise (#396 STEP 3, Yiyi's net ruling
  # 2026-07-22). The per-tech gross out| leaves (out|meth_exp, out|export_NH3,
  # out|lh2_exp, ...) stay published UNCHANGED as observability (Yiyi approved the
  # leaf/aggregate duplication).

  # --- Per-commodity in|all / out|all totals ---
  # FAMILY SEMANTICS: in|all|<c> = REGIONAL consumption of <c>; international
  # shipping bunkers are EXCLUDED for every commodity. Bunkers are GLB-native
  # (they report only at R12_GLB, the World-level sink) and stay first-class in
  # in|Shipping|all and the Final Energy|Bunkers|Shipping family. This matches
  # the legacy trade convention ("excluding use for international shipping") and
  # makes the three commodities symmetric -- in|all|NH3 always excluded its
  # bunker. It is also structural: one aggregate = ONE REGION BASIS, exactly as
  # one file = one unit. The engine refuses a variable mixing GLB-native and
  # regional rows (check_region_purity, raised before the World step), because
  # the World step cannot classify it -- so a spec that globs a bunker leaf into
  # regional components fails the run loudly instead of publishing an
  # understated World row. A "consumption incl. bunkers" total would need
  # post-World aggregation, an engine extension deliberately not built.
  # Q6 split rule: a single total is ONE unit, so these are the commodity's NATIVE
  # basis; the cross-basis pieces are excluded (a separate total, not in the spec).
  # in|all|hydrogen: all H2 consumption (EJ). Lists the meth_h2 CO2-source TOTAL
  # aggregate (in|Industry|Chemicals|meth_h2|hydrogen) and NOT its three split
  # leaves, so meth_h2 is counted once (a glob in|*|hydrogen would match both and
  # double-count). Chemicals H2 consumers beyond h2_liq + meth_h2 + h2_NH3 would
  # need adding.
  - name: in|all|hydrogen
    patterns:
      - "in|Industry|Chemicals|h2_liq|hydrogen"
      - "in|Industry|Chemicals|meth_h2|hydrogen"
      - "in|Industry|Chemicals|h2_NH3|hydrogen"
      - "in|Industry|Other|*|hydrogen"
      - "in|Industry|Iron and Steel|*|hydrogen"
      - "in|Industry|Refining|*|hydrogen"
      - "in|Power|*|hydrogen"
      - "in|Transportation|*|hydrogen"
    unit: EJ/yr
  # in|all|methanol: ENERGY methanol consumption only (EJ). The material feedstock
  # consumers (MTO_petro, CH2O_synth, meth_ind_fs -- Mt) are the separate mass
  # total, excluded here to keep one unit.
  - name: in|all|methanol
    patterns:
      - "in|Industry|Other|furnace_methanol_*|methanol"
      - "in|Transportation|*|methanol"
    unit: EJ/yr
  # in|all|NH3: MATERIAL ammonia consumption (Mt). The shipping bunker
  # (in|Shipping|NH3_bunker|ammonia, EJ) is excluded per the family semantics
  # above (and is additionally cross-basis).
  - name: in|all|NH3
    patterns:
      - "in|Industry|Chemicals|NH3_to_N_fertil|NH3"
      - "in|Chemicals|residual_NH3|ammonia"
    unit: Mt/yr
  # out|all|methanol: total methanol PRODUCTION (EJ; producers are energy-basis,
  # the Mt bridge is downstream at meth_t_d). Exact producers prevent the
  # material-basis meth_ind_fs output from entering this total.
  - name: out|all|methanol
    patterns:
      - "out|meth_bio|methanol"
      - "out|meth_bio_ccs|methanol"
      - "out|meth_coal|methanol"
      - "out|meth_coal_ccs|methanol"
      - "out|meth_h2|methanol"
      - "out|meth_ng|methanol"
      - "out|meth_ng_ccs|methanol"
    unit: EJ/yr
  # out|all|NH3: total ammonia PRODUCTION (Mt). Exact producers include h2_NH3
  # and exclude the downstream residual_NH3 conversion.
  - name: out|all|NH3
    patterns:
      - "out|biomass_NH3|NH3"
      - "out|biomass_NH3_ccs|NH3"
      - "out|coal_NH3|NH3"
      - "out|coal_NH3_ccs|NH3"
      - "out|electr_NH3|NH3"
      - "out|fueloil_NH3|NH3"
      - "out|fueloil_NH3_ccs|NH3"
      - "out|gas_NH3|NH3"
      - "out|gas_NH3_ccs|NH3"
      - "out|h2_NH3|NH3"
    unit: Mt/yr
  # Per-mode transport input totals (EJ; all transport fuels are energy-basis).
  # in|Shipping|all shares the in|Shipping|* match with Final Energy|Bunkers|Shipping
  # -- same value under the raw-name convention, a distinct variable, not a
  # double-count (that guard is within a single aggregate's components).
  - name: in|Transportation|Bus|all
    patterns: ["in|Transportation|Bus|*"]
    unit: EJ/yr
  - name: in|Transportation|Light-Duty Vehicle|all
    patterns: ["in|Transportation|Light-Duty Vehicle|*"]
    unit: EJ/yr
  - name: in|Transportation|Truck|all
    patterns: ["in|Transportation|Truck|*"]
    unit: EJ/yr
  - name: in|Shipping|all
    patterns: ["in|Shipping|*"]
    unit: EJ/yr
