# EFC ammonia-route INPUT energy flows (EJ/yr). Producer fuel/electricity leaves use
# Industry|Chemicals names; the shipping leaf remains attributed to Shipping.
# Ammonia is mass (Mt) everywhere EXCEPT the shipping-fuel pathway. NH3_tobunker converts
# NH3@export (mass, Mt) -> NH3@final (energy, GWa) at 1/convert_nh3 = 1.67856 Mt/GWa
# (LHV 18.8 MJ/kg; see message_data tools/utilities/update_shipping.py add_NH3_bunker).
# NH3_bunker therefore draws NH3@final in ENERGY (GWa), exactly like meth_bunker / eth_bunker,
# so it is reported in EJ/yr on the common marine-fuel energy basis. This resolves the #284
# unit question: every *_bunker input is GWa; the sole mass quantity is NH3_tobunker's @export
# input. Florian confirmed all bunkers are 1:1; LH2_bunker's 1.3 is an in-energy loss.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  # Shipping bunker — NH3@final is energy (GWa) via the NH3_tobunker mass->energy bridge.
  Shipping|NH3_bunker|ammonia:
    filter:
      technology: NH3_bunker
      commodity: NH3
      level: final
      mode: [shp_bulk_short_future, shp_bulk_long_future, shp_container_short_future, shp_container_long_future,
             shp_general_short_future, shp_general_long_future, shp_roro_short_future, shp_roro_long_future,
             shp_chemical]
    original_unit: GWa
    short: in_NH3_bunker_ammonia

  # Ammonia production inputs are energy quantities even though NH3 output is mass.
  Industry|Chemicals|biomass_NH3_ccs|biomass:
    filter: {technology: biomass_NH3_ccs, commodity: biomass, level: primary, mode: M1}
    original_unit: GWa
    short: in_biomass_NH3_ccs_biomass

  Industry|Chemicals|biomass_NH3_ccs|electr:
    filter: {technology: biomass_NH3_ccs, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_biomass_NH3_ccs_electr

  Industry|Chemicals|biomass_NH3|biomass:
    filter: {technology: biomass_NH3, commodity: biomass, level: primary, mode: M1}
    original_unit: GWa
    short: in_biomass_NH3_biomass

  Industry|Chemicals|biomass_NH3|electr:
    filter: {technology: biomass_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_biomass_NH3_electr

  Industry|Chemicals|coal_NH3_ccs|coal:
    filter: {technology: coal_NH3_ccs, commodity: coal, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_NH3_ccs_coal

  Industry|Chemicals|coal_NH3_ccs|electr:
    filter: {technology: coal_NH3_ccs, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_NH3_ccs_electr

  Industry|Chemicals|coal_NH3|coal:
    filter: {technology: coal_NH3, commodity: coal, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_NH3_coal

  Industry|Chemicals|coal_NH3|electr:
    filter: {technology: coal_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_coal_NH3_electr

  Industry|Chemicals|electr_NH3|electr:
    filter: {technology: electr_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_electr_NH3_electr

  Industry|Chemicals|fueloil_NH3_ccs|electr:
    filter: {technology: fueloil_NH3_ccs, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_fueloil_NH3_ccs_electr

  Industry|Chemicals|fueloil_NH3_ccs|fueloil:
    filter: {technology: fueloil_NH3_ccs, commodity: fueloil, level: secondary, mode: M1}
    original_unit: GWa
    short: in_fueloil_NH3_ccs_fueloil

  Industry|Chemicals|fueloil_NH3|electr:
    filter: {technology: fueloil_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_fueloil_NH3_electr

  Industry|Chemicals|fueloil_NH3|fueloil:
    filter: {technology: fueloil_NH3, commodity: fueloil, level: secondary, mode: M1}
    original_unit: GWa
    short: in_fueloil_NH3_fueloil

  Industry|Chemicals|gas_NH3_ccs|electr:
    filter: {technology: gas_NH3_ccs, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_NH3_ccs_electr

  Industry|Chemicals|gas_NH3_ccs|gas:
    filter: {technology: gas_NH3_ccs, commodity: gas, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_NH3_ccs_gas

  Industry|Chemicals|gas_NH3|electr:
    filter: {technology: gas_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_NH3_electr

  Industry|Chemicals|gas_NH3|gas:
    filter: {technology: gas_NH3, commodity: gas, level: secondary, mode: M1}
    original_unit: GWa
    short: in_gas_NH3_gas

  # Merchant-hydrogen route: draws hydrogen@secondary (near-site production basis,
  # matching the LCOH(h2_smr) calibration anchor and the meth_h2 feedstock peer).
  Industry|Chemicals|h2_NH3|hydrogen:
    filter: {technology: h2_NH3, commodity: hydrogen, level: secondary, mode: M1}
    original_unit: GWa
    short: in_h2_NH3_hydrogen

  Industry|Chemicals|h2_NH3|electr:
    filter: {technology: h2_NH3, commodity: electr, level: secondary, mode: M1}
    original_unit: GWa
    short: in_h2_NH3_electr
