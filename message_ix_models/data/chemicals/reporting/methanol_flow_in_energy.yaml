# EFC methanol INPUT energy flows: in|<Sector>|<Subsector>|<tech>|methanol (EJ/yr).
# Energy/fuel CONSUMPTION of methanol (GWa -> EJ/yr): industry furnaces, transport, and
# shipping bunker, all drawing methanol at the (energy) final level — except
# furnace_methanol_refining, which draws at secondary. These are upstream of any energy->mass
# conversion, so they stay energy. The plain "methanol" commodity label marks EJ/yr (vs the
# Mt "methanol feedstock material" in methanol_flow_in_material.yaml). Sectors per the
# customer spec: industry furnaces -> Industry|Other; vehicles -> Transportation|<subsector>;
# bunker -> Shipping.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  # Industry furnaces (final level; high/low temperature modes)
  Industry|Other|furnace_methanol_steel|methanol:
    filter: {technology: furnace_methanol_steel, commodity: methanol, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_methanol_steel_methanol

  # Cement heat demand is high-temperature only: the materials source data
  # (data/material/other/generic.csv) defines this furnace with a single
  # high_temp mode (no low_temp input, no lt_heat output), unlike the other
  # furnaces. Coord-checked on the baseline 2026-07-07.
  Industry|Other|furnace_methanol_cement|methanol:
    filter: {technology: furnace_methanol_cement, commodity: methanol, level: final, mode: [high_temp]}
    original_unit: GWa
    short: in_furnace_methanol_cement_methanol

  Industry|Other|furnace_methanol_petro|methanol:
    filter: {technology: furnace_methanol_petro, commodity: methanol, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_methanol_petro_methanol

  Industry|Other|furnace_methanol_resins|methanol:
    filter: {technology: furnace_methanol_resins, commodity: methanol, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_methanol_resins_methanol

  Industry|Other|furnace_methanol_aluminum|methanol:
    filter: {technology: furnace_methanol_aluminum, commodity: methanol, level: final, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_methanol_aluminum_methanol

  # Refining furnace draws at secondary (not final)
  Industry|Other|furnace_methanol_refining|methanol:
    filter: {technology: furnace_methanol_refining, commodity: methanol, level: secondary, mode: [high_temp, low_temp]}
    original_unit: GWa
    short: in_furnace_methanol_refining_methanol

  # Transport (final level, mode "all")
  Transportation|Bus|FCm_bus|methanol:
    filter: {technology: FCm_bus, commodity: methanol, level: final, mode: all}
    original_unit: GWa
    short: in_FCm_bus_methanol

  Transportation|Light-Duty Vehicle|IAHm_ptrp|methanol:
    filter: {technology: IAHm_ptrp, commodity: methanol, level: final, mode: all}
    original_unit: GWa
    short: in_IAHm_ptrp_methanol

  Transportation|Light-Duty Vehicle|ICAm_ptrp|methanol:
    filter: {technology: ICAm_ptrp, commodity: methanol, level: final, mode: all}
    original_unit: GWa
    short: in_ICAm_ptrp_methanol

  Transportation|Aviation|conm_ar|methanol:
    filter: {technology: conm_ar, commodity: methanol, level: final, mode: all}
    original_unit: GWa
    short: in_conm_ar_methanol

  Transportation|Truck|f road methanol|methanol:
    filter: {technology: "f road methanol", commodity: methanol, level: final, mode: all}
    original_unit: GWa
    short: in_f_road_methanol_methanol

  # Shipping bunker (final level). Unit unverified pending Florian / #284; methanol bunker
  # draws at the energy final level (GWa) like other fuel uses, so reported in EJ/yr for now.
  Shipping|meth_bunker|methanol:
    filter:
      technology: meth_bunker
      commodity: methanol
      level: final
      mode: [shp_bulk_long_current, shp_bulk_long_future, shp_bulk_short_current, shp_bulk_short_future,
             shp_chemical, shp_container_long_current, shp_container_long_future, shp_container_short_current,
             shp_container_short_future, shp_general_long_current, shp_general_long_future,
             shp_general_short_current, shp_general_short_future, shp_oil, shp_roro_long_current,
             shp_roro_long_future, shp_roro_short_current, shp_roro_short_future, shp_solid]
    original_unit: GWa
    short: in_meth_bunker_methanol

  # meth_h2 merchant-H2 input -> methanol synthesis, split by CO2 source for the spec's
  # Final Energy|Industry|Chemicals|Methanol|Hydrogen|{BIC,FIC,DAC}_CO2 rows. Each leaf
  # pairs the feedstock+fuel modes of one CO2 source (the input is hydrogen@secondary
  # either way; fuel-vs-feedstock only routes the methanol OUTPUT). The three leaves
  # partition the verified 6-mode set, so the spec target
  # in|Industry|Chemicals|meth_h2|hydrogen is rebuilt identically as their aggregate
  # (methanol_flow_in_energy_aggregates.yaml) -- keep the partition exhaustive if modes
  # are ever added to meth_h2.
  Industry|Chemicals|meth_h2|BIC_CO2|hydrogen:
    filter:
      technology: meth_h2
      commodity: hydrogen
      level: secondary
      mode: [feedstock_bic, fuel_bic]
    original_unit: GWa
    short: in_meth_h2_bic_hydrogen

  Industry|Chemicals|meth_h2|DAC_CO2|hydrogen:
    filter:
      technology: meth_h2
      commodity: hydrogen
      level: secondary
      mode: [feedstock_dac, fuel_dac]
    original_unit: GWa
    short: in_meth_h2_dac_hydrogen

  Industry|Chemicals|meth_h2|FIC_CO2|hydrogen:
    filter:
      technology: meth_h2
      commodity: hydrogen
      level: secondary
      mode: [feedstock_fic, fuel_fic]
    original_unit: GWa
    short: in_meth_h2_fic_hydrogen
