# EFC olefins-process (MTO_petro + steam_cracker_petro) INPUT energy flows:
#   in|<...>|<tech>|<carrier> (EJ/yr).
# Non-feedstock energy inputs of the olefins processes -- high-temperature heat and
# electricity -- drawn at the (energy) useful_petro / final levels (GWa -> EJ/yr). The
# feedstocks themselves are mass: MTO_petro methanol -> methanol_flow_in_material; the
# steam-cracker naphtha/gasoil/ethane/propane -> steam_cracker_flow_in_material (Mt).
# Spec keys these sector-less (others_olefins): in|MTO_petro|ht_heat/electr,
# in|steam_cracker_petro|ht_heat/electr.
var: in
iamc_prefix: "in|"
unit: EJ/yr

vars:
  MTO_petro|ht_heat:
    filter: {technology: MTO_petro, commodity: ht_heat, level: useful_petro, mode: M1}
    original_unit: GWa
    short: in_MTO_petro_ht_heat

  MTO_petro|electr:
    filter: {technology: MTO_petro, commodity: electr, level: final, mode: M1}
    original_unit: GWa
    short: in_MTO_petro_electr

  # steam_cracker_petro process energy inputs: electr @final, ht_heat @useful_petro; 5 feedstock modes
  steam_cracker_petro|electr:
    filter:
      technology: steam_cracker_petro
      commodity: electr
      level: final
      mode: [atm_gasoil, ethane, naphtha, propane, vacuum_gasoil]
    original_unit: GWa
    short: in_steam_cracker_petro_electr

  steam_cracker_petro|ht_heat:
    filter:
      technology: steam_cracker_petro
      commodity: ht_heat
      level: useful_petro
      mode: [atm_gasoil, ethane, naphtha, propane, vacuum_gasoil]
    original_unit: GWa
    short: in_steam_cracker_petro_ht_heat
