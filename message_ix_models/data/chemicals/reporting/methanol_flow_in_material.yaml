# EFC methanol INPUT material flows: in|<Sector>|<Subsector>|<tech>|methanol (Mt/yr).
# Material-methanol CONSUMPTION: the chemical-feedstock end uses that draw methanol at
# level final_material (mass, Mt) — downstream of the meth_t_d energy->mass conversion.
# Sum of these balances out|meth_t_d|methanol feedstock material. Customer spec uses the plain
# "methanol" commodity label and the Industry|Chemicals subsector. MTO_petro is reported under
# BOTH the spec's Industry|Chemicals name and the sector-less olefins-family name (keep both).
var: in
iamc_prefix: "in|"
unit: Mt/yr

vars:
  Industry|Chemicals|MTO_petro|methanol:
    filter: {technology: MTO_petro, commodity: methanol, level: final_material, mode: M1}
    original_unit: Mt/yr
    short: in_MTO_petro_methanol_feedstock_material

  # Same MTO_petro flow, also reported sector-less per the spec's olefins family (keep both)
  MTO_petro|methanol:
    filter: {technology: MTO_petro, commodity: methanol, level: final_material, mode: M1}
    original_unit: Mt/yr
    short: in_MTO_petro_methanol_bare

  Industry|Chemicals|CH2O_synth|methanol:
    filter: {technology: CH2O_synth, commodity: methanol, level: final_material, mode: M1}
    original_unit: Mt/yr
    short: in_CH2O_synth_methanol_feedstock_material

  # Not in the customer spec; kept as an extra.
  Chemicals|meth_ind_fs|methanol feedstock material:
    filter: {technology: meth_ind_fs, commodity: methanol, level: final_material, mode: M1}
    original_unit: Mt/yr
    short: in_meth_ind_fs_methanol_feedstock_material
