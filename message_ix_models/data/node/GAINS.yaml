# Node code list for GAINS
#
# Source: Transcribed 2026-09-02 by PN Kishimoto
#
# - The top-level codes are those appearing in a particular
#   emissions data file.
# - A supplementary table from an unknown report, in a section
#   labelled “S2: Regional aggregations”, is used to populate
#   the children (countries) of each node. See inline comments.

